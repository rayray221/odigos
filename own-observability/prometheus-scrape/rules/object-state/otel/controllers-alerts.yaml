            runbook_url: "https://docs.odigos.io/"
        # ---------------------------------------------------------------
        # Controller odigos-instrumentor crash-looping (OTel approximation).
        # ---------------------------------------------------------------
        - alert: InstrumentorPodsCrashLooping
          expr: |
            count by (k8s_namespace_name) (
