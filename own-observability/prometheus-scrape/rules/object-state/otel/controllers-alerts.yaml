              Approximates CrashLoopBackOff. Odigos reconciliation is degraded.
            action: |
              kubectl -n odigos-system get pods -l app.kubernetes.io/name=odigos-scheduler
              kubectl -n odigos-system logs deploy/odigos-scheduler -c odigos-scheduler --previous --tail=200
            runbook_url: "https://docs.odigos.io/"
        # ---------------------------------------------------------------
        # Controller odigos-scheduler k8sclusterreceiver metric missing.
        # ---------------------------------------------------------------
