# Odigos collector throughput / data-loss alerts — Prometheus scrape method.
#
# Label scheme: namespace / pod (Operator scrape of the collector `/metrics`
# endpoints; see ../../capture/). Counters carry `_total` when scraped; rules
# match `(_total)?` so they also work if your backend strips it.
#
# Role is distinguished by pod name: the node collector (DaemonSet) is
# `odigos-data-collection-*`; the cluster collector / gateway (Deployment) is
# `odigos-gateway-*`. This requires the `pod` target label to be present
# (the ServiceMonitors in ../../capture/ provide it).
#
# Metric names validated against frontend/services/metrics/collector_metrics.go.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: odigos-collector-dataloss-alerts
  namespace: odigos-system
  labels:
    app.kubernetes.io/part-of: odigos
    app.kubernetes.io/component: odigos-telemetry
    release: prometheus
spec:
  groups:
    # ------------------------------------------------------------------------
    # Node collector (DaemonSet odigos-data-collection-*) — data loss.
    # ------------------------------------------------------------------------
    - name: odigos.node-collector.dataloss.rules
      rules:
        - alert: OdigosNodeCollectorEbpfLostSamples
          expr: |
            sum by (pod) (
              rate({__name__=~"otelcol_odigos_ebpf_lost_samples(_total)?", namespace=~"odigos-system", pod=~"odigos-data-collection-.+"}[5m])
            ) > 0
          for: 5m
          labels:
            severity: critical
            component: odigos-node-collector
            service: odigos
          annotations:
            summary: "Odigos node collector is losing eBPF samples (data dropped)"
            description: |
              Node collector pod {{ $labels.pod }} lost {{ $value | humanize }}
              eBPF samples/sec over the last 5m. Telemetry is produced faster than
              the collector can drain the eBPF buffer. Raise node collector
              CPU/memory limits or reduce per-node load.
            runbook_url: "https://docs.odigos.io/"
        - alert: OdigosNodeCollectorReceiverRefusingData
          expr: |
            sum by (pod) (
              rate({__name__=~"otelcol_receiver_refused_(spans|metric_points|log_records)(_total)?", namespace=~"odigos-system", pod=~"odigos-data-collection-.+"}[5m])
            ) > 0
          for: 5m
          labels:
            severity: critical
            component: odigos-node-collector
            service: odigos
          annotations:
            summary: "Odigos node collector receiver is refusing data (data dropped)"
            description: |
              Node collector pod {{ $labels.pod }} refused {{ $value | humanize }}
              items/sec at its receiver over the last 5m, usually due to memory
              pressure or downstream backpressure.
            runbook_url: "https://docs.odigos.io/"
        - alert: OdigosNodeCollectorMemoryRejections
          expr: |
            sum by (pod) (
              rate({__name__=~"otelcol_odigos_collector_memory_limiter_batch_rejections(_total)?", namespace=~"odigos-system", pod=~"odigos-data-collection-.+"}[5m])
            ) > 0
          for: 5m
          labels:
            severity: critical
            component: odigos-node-collector
            service: odigos
          annotations:
            summary: "Odigos node collector is rejecting batches under memory pressure (data dropped)"
            description: |
              Node collector pod {{ $labels.pod }} rejected {{ $value | humanize }}
              gRPC batches/sec due to its runtime memory limit over the last 5m.
              With drop_on_overload enabled these batches are dropped. Increase the
              node collector memory limit.
            runbook_url: "https://docs.odigos.io/"
        - alert: OdigosNodeCollectorExportFailingToGateway
          expr: |
            sum by (pod) (
              rate({__name__=~"otelcol_exporter_send_failed_(spans|metric_points|log_records)(_total)?", namespace=~"odigos-system", pod=~"odigos-data-collection-.+"}[5m])
            ) > 0
          for: 5m
          labels:
            severity: critical
            component: odigos-node-collector
            service: odigos
          annotations:
            summary: "Odigos node collector is failing to export to the gateway"
            description: |
              Node collector pod {{ $labels.pod }} failed to export
              {{ $value | humanize }} items/sec to the cluster collector over the
              last 5m. Check gateway health and the node->gateway connection.
            runbook_url: "https://docs.odigos.io/"
        # Leading indicator — fires before samples are lost.
        - alert: OdigosNodeCollectorEbpfMemoryPressureHigh
          expr: |
            (
              sum by (pod) (
                rate({__name__=~"otelcol_ebpf_memory_pressure_wait_time(_milliseconds)?(_total)?", namespace=~"odigos-system", pod=~"odigos-data-collection-.+"}[5m])
              ) / 1000
            ) > 0.1
          for: 10m
          labels:
            severity: warning
            component: odigos-node-collector
            service: odigos
          annotations:
            summary: "Odigos node collector eBPF receiver under sustained memory pressure"
            description: |
              Node collector pod {{ $labels.pod }} spent {{ $value | humanizePercentage }}
              of the last 10m blocked on memory pressure in the eBPF receiver. This
              precedes lost samples — raise the node collector memory limit before
              data is dropped.
            runbook_url: "https://docs.odigos.io/"
        # Agent-side (odiglet eBPF instrumentation) drops, before the collector.
        - alert: OdigosInstrumentationAgentDroppingEvents
          expr: |
            sum by (pod) (
              rate({__name__=~"odigos_(python|nodejs)_ebpf_instrumentation_(output_failed_events|events_too_larger)(_total)?", namespace=~"odigos-system"}[5m])
            ) > 0
          for: 10m
          labels:
            severity: warning
            component: odigos-instrumentation-agent
            service: odigos
          annotations:
            summary: "Odigos instrumentation agent is dropping events"
            description: |
              The instrumentation agent (pod {{ $labels.pod }}) dropped
              {{ $value | humanize }} events/sec (failed to emit or too large) over
              the last 10m. These events never reach the node collector.
            runbook_url: "https://docs.odigos.io/"
        # Normalized drop ratio: 100 * refused / (accepted + refused).
        # tune: threshold `> 1` (percent) and `for: 15m` below.
        - alert: OdigosNodeCollectorHighDropRatio
          expr: |
            100 *
            (
              sum by (pod) (rate({__name__=~"otelcol_receiver_refused_(spans|metric_points|log_records)(_total)?", namespace=~"odigos-system", pod=~"odigos-data-collection-.+"}[5m]))
              /
              clamp_min(
                sum by (pod) (rate({__name__=~"otelcol_receiver_(accepted|refused)_(spans|metric_points|log_records)(_total)?", namespace=~"odigos-system", pod=~"odigos-data-collection-.+"}[5m])),
                1
              )
            ) > 1
          for: 15m
          labels:
            severity: warning
            component: odigos-node-collector
            service: odigos
          annotations:
            summary: "Odigos node collector sustained drop ratio > 1%"
            description: |
              Node collector pod {{ $labels.pod }} is refusing
              {{ $value | humanize }}% of received telemetry over the last 15m
              (refused / (accepted + refused)). Sustained proportional loss —
              scale or raise limits on the node collector.
            runbook_url: "https://docs.odigos.io/"
    # ------------------------------------------------------------------------
    # Cluster collector / gateway (Deployment odigos-gateway-*) — data loss.
    # ------------------------------------------------------------------------
    - name: odigos.gateway.dataloss.rules
      rules:
        - alert: OdigosGatewayMemoryRejections
          expr: |
            sum by (pod) (
              rate({__name__=~"otelcol_odigos_collector_memory_limiter_batch_rejections(_total)?", namespace=~"odigos-system", pod=~"odigos-gateway-.+"}[5m])
            ) > 0
          for: 5m
          labels:
            severity: critical
            component: odigos-gateway
            service: odigos
          annotations:
            summary: "Odigos gateway is rejecting batches under memory pressure"
            description: |
              Gateway pod {{ $labels.pod }} rejected {{ $value | humanize }}
              batches/sec due to its runtime memory limit over the last 5m. The
              gateway is overloaded; it should scale out (check the HPA) or get a
              higher memory limit / GOMEMLIMIT.
            runbook_url: "https://docs.odigos.io/"
        - alert: OdigosGatewayReceiverRefusingData
          expr: |
            sum by (pod) (
              rate({__name__=~"otelcol_receiver_refused_(spans|metric_points|log_records)(_total)?", namespace=~"odigos-system", pod=~"odigos-gateway-.+"}[5m])
            ) > 0
          for: 5m
          labels:
            severity: critical
            component: odigos-gateway
            service: odigos
          annotations:
            summary: "Odigos gateway receiver is refusing data (data dropped)"
            description: |
              Gateway pod {{ $labels.pod }} refused {{ $value | humanize }}
              items/sec at its receiver over the last 5m. Incoming telemetry is
              being rejected at ingest.
            runbook_url: "https://docs.odigos.io/"
        - alert: OdigosGatewayExportFailures
          expr: |
            sum by (pod, exporter) (
              rate({__name__=~"otelcol_exporter_send_failed_(spans|metric_points|log_records)(_total)?", namespace=~"odigos-system", pod=~"odigos-gateway-.+"}[5m])
            ) > 0
          for: 5m
          labels:
            severity: critical
            component: odigos-gateway
            service: odigos
          annotations:
            summary: "Odigos gateway is failing to export to a destination"
            description: |
              Gateway pod {{ $labels.pod }} failed to export {{ $value | humanize }}
              items/sec to destination "{{ $labels.exporter }}" over the last 5m.
              Check that backend's availability, credentials, and quota.
            runbook_url: "https://docs.odigos.io/"
        - alert: OdigosGatewayEnqueueFailures
          expr: |
            sum by (pod, exporter) (
              rate({__name__=~"otelcol_exporter_enqueue_failed_(spans|metric_points|log_records)(_total)?", namespace=~"odigos-system", pod=~"odigos-gateway-.+"}[5m])
            ) > 0
          for: 5m
          labels:
            severity: critical
            component: odigos-gateway
            service: odigos
          annotations:
            summary: "Odigos gateway exporter queue is full (data dropped on enqueue)"
            description: |
              Gateway pod {{ $labels.pod }} failed to enqueue {{ $value | humanize }}
              items/sec for destination "{{ $labels.exporter }}" over the last 5m.
              The send queue is full, typically because the destination is slow or
              down.
            runbook_url: "https://docs.odigos.io/"
        # Leading indicator — send queue saturating before enqueue failures.
        - alert: OdigosGatewayExporterQueueSaturation
          expr: |
            (
              max by (pod, exporter) ({__name__=~"otelcol_exporter_queue_size(_total)?", namespace=~"odigos-system", pod=~"odigos-gateway-.+"})
              /
              max by (pod, exporter) ({__name__=~"otelcol_exporter_queue_capacity(_total)?", namespace=~"odigos-system", pod=~"odigos-gateway-.+"})
            ) > 0.8
          for: 10m
          labels:
            severity: warning
            component: odigos-gateway
            service: odigos
          annotations:
            summary: "Odigos gateway exporter queue is nearly full"
            description: |
              Gateway pod {{ $labels.pod }} send queue for destination
              "{{ $labels.exporter }}" is {{ $value | humanizePercentage }} full over
              the last 10m. Approaching enqueue failures — check destination
              latency/throughput.
            runbook_url: "https://docs.odigos.io/"
        # CAVEAT: `odigos_gateway_rejections` is exposed by the Odigos autoscaler on
        # the Kubernetes custom.metrics.k8s.io API (for the HPA). It is NOT funneled
        # through the Odigos pipeline, so this rule only fires if you separately
        # scrape that custom metric into your Prometheus. Otherwise rely on
        # OdigosGatewayMemoryRejections above.
        - alert: OdigosGatewayRejectionSignalActive
          expr: odigos_gateway_rejections >= 0.5
          for: 5m
          labels:
            severity: warning
            component: odigos-gateway
            service: odigos
          annotations:
            summary: "Odigos gateway fleet is in a rejecting state"
            description: |
              The Odigos autoscaler reports odigos_gateway_rejections={{ $value }}
              (>= 0.5 means at least half of the gateway pods are rejecting data,
              OOMKilled, or crash-looping). The gateway should be scaling up — verify
              the HPA and pod resource limits.
            prerequisite: "Requires scraping odigos_gateway_rejections from the custom.metrics.k8s.io API; not part of the Odigos pipeline."
            runbook_url: "https://docs.odigos.io/"
        # Normalized drop ratio: 100 * refused / (accepted + refused).
        # tune: threshold `> 1` (percent) and `for: 15m` below.
        - alert: OdigosGatewayHighDropRatio
          expr: |
            100 *
            (
              sum by (pod) (rate({__name__=~"otelcol_receiver_refused_(spans|metric_points|log_records)(_total)?", namespace=~"odigos-system", pod=~"odigos-gateway-.+"}[5m]))
              /
              clamp_min(
                sum by (pod) (rate({__name__=~"otelcol_receiver_(accepted|refused)_(spans|metric_points|log_records)(_total)?", namespace=~"odigos-system", pod=~"odigos-gateway-.+"}[5m])),
                1
              )
            ) > 1
          for: 15m
          labels:
            severity: warning
            component: odigos-gateway
            service: odigos
          annotations:
            summary: "Odigos gateway sustained drop ratio > 1%"
            description: |
              Gateway pod {{ $labels.pod }} is refusing {{ $value | humanize }}% of
              received telemetry over the last 15m (refused / (accepted + refused)).
              Sustained proportional loss — scale the gateway or raise its limits.
            runbook_url: "https://docs.odigos.io/"
