# Odigos UI Deployment object-state alerts — kube-state-metrics (kube_*) source.
# Rendered from the odigos-prometheus-alerts chart (components.ui.enabled=true,
# metricSource=ksm); only the manifest is migrated, not the chart.
#
# Object-state source: kube-state-metrics. Apply this OR the otel/ set, not both.
# See ./README.md for prerequisites and ../../../README.md for the capture method.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: odigos-ui-alerts-ksm
  namespace: odigos-system
  labels:
    app.kubernetes.io/part-of: odigos
    app.kubernetes.io/component: ui
    release: prometheus
spec:
  groups:
    - name: ui.deployment.ksm.rules
      rules:
        - alert: OdigosUiNotAvailable
          expr: |
            kube_deployment_status_replicas_available{
              namespace=~"odigos-system", deployment=~"odigos-ui"
            } < 1
          for: 15m
          labels:
            severity: warning
            alert_type: availability
            component: "ui"
            service: "odigos"
          annotations:
            summary: "Odigos UI has no available replicas"
            description: |
              Deployment {{ $labels.namespace }}/{{ $labels.deployment }}
              has no available replicas for more than 15m. The
              Odigos web UI is unreachable but telemetry collection is
              unaffected.
            runbook_url: "https://docs.odigos.io/"
        - alert: OdigosUiDeploymentAbsent
          expr: |
            absent(
              kube_deployment_spec_replicas{
                namespace=~"odigos-system", deployment=~"odigos-ui"
              }
            )
          for: 30m
          labels:
            severity: warning
            alert_type: absent
            component: "ui"
            service: "odigos"
          annotations:
            summary: "Odigos UI Deployment metrics absent"
            description: |
              No `kube_deployment_spec_replicas` series for namespace
              `odigos-system` / deployment `odigos-ui` for more than 30m.
            runbook_url: "https://docs.odigos.io/"
