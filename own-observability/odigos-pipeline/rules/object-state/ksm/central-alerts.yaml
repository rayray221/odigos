# Odigos Central object-state alerts (central-proxy / central-backend /
# central-ui) — kube-state-metrics (kube_*) source.
# Rendered from the odigos-prometheus-alerts chart (components.central.enabled=true,
# metricSource=ksm); only the manifest is migrated, not the chart.
#
# NOTE: Central runs in its own cluster/namespace (odigos-central). This rule is
# a no-op where Odigos Central is not deployed; apply it only on the central
# cluster (and ensure Prometheus watches the odigos-central namespace).
#
# Object-state source: kube-state-metrics. Apply this OR the otel/ set, not both.
# See ./README.md for prerequisites and ../../../README.md for the capture method.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: odigos-central-alerts-ksm
  namespace: odigos-central
  labels:
    app.kubernetes.io/part-of: odigos
    app.kubernetes.io/component: central
    release: prometheus
spec:
  groups:
    - name: central.deployments.ksm.rules
      rules:
        - alert: CentralProxyNotAvailable
          expr: |
            kube_deployment_status_replicas_available{
              namespace=~"odigos-central", deployment=~"central-proxy"
            } < 1
          for: 10m
          labels:
            severity: warning
            alert_type: availability
            component: "central-proxy"
            service: "odigos"
          annotations:
            summary: "Odigos central-proxy has fewer than 1 available replica(s)"
            description: |
              Deployment {{ $labels.namespace }}/{{ $labels.deployment }}
              has only {{ $value }} available replica(s),
              below the configured minimum of 1 for more than
              10m.
            action: |
              kubectl -n odigos-central get pods -l app.kubernetes.io/name=central-proxy
              kubectl -n odigos-central describe deploy central-proxy
            runbook_url: "https://docs.odigos.io/"
        - alert: CentralProxyPodsCrashLooping
          expr: |
            count by (namespace) (
              kube_pod_container_status_waiting_reason{
                reason="CrashLoopBackOff",
                namespace=~"odigos-central",
                pod=~"central-proxy-.*",
                container=~"central-proxy"
              }
            ) >= 1
          for: 5m
          labels:
            severity: critical
            alert_type: crashloop
            component: "central-proxy"
            service: "odigos"
          annotations:
            summary: "Odigos central-proxy pods are in CrashLoopBackOff (>= 1)"
            description: |
              {{ $value }} pod(s) of central-proxy in
              namespace {{ $labels.namespace }} have been
              in CrashLoopBackOff for more than 5m.
            action: |
              kubectl -n odigos-central logs deploy/central-proxy -c central-proxy --previous --tail=200
            runbook_url: "https://docs.odigos.io/"
        - alert: CentralProxyDeploymentAbsent
          expr: |
            absent(
              kube_deployment_spec_replicas{
                namespace=~"odigos-central", deployment=~"central-proxy"
              }
            )
          for: 15m
          labels:
            severity: critical
            alert_type: absent
            component: "central-proxy"
            service: "odigos"
          annotations:
            summary: "Odigos central-proxy Deployment metrics absent"
            description: |
              No `kube_deployment_spec_replicas` series for namespace
              `odigos-central` / deployment `central-proxy` for more than 15m.
            runbook_url: "https://docs.odigos.io/"
        - alert: CentralBackendNotAvailable
          expr: |
            kube_deployment_status_replicas_available{
              namespace=~"odigos-central", deployment=~"central-backend"
            } < 1
          for: 10m
          labels:
            severity: warning
            alert_type: availability
            component: "central-backend"
            service: "odigos"
          annotations:
            summary: "Odigos central-backend has fewer than 1 available replica(s)"
            description: |
              Deployment {{ $labels.namespace }}/{{ $labels.deployment }}
              has only {{ $value }} available replica(s),
              below the configured minimum of 1 for more than
              10m.
            action: |
              kubectl -n odigos-central get pods -l app.kubernetes.io/name=central-backend
              kubectl -n odigos-central describe deploy central-backend
            runbook_url: "https://docs.odigos.io/"
        - alert: CentralBackendPodsCrashLooping
          expr: |
            count by (namespace) (
              kube_pod_container_status_waiting_reason{
                reason="CrashLoopBackOff",
                namespace=~"odigos-central",
                pod=~"central-backend-.*",
                container=~"central-backend"
              }
            ) >= 1
          for: 5m
          labels:
            severity: critical
            alert_type: crashloop
            component: "central-backend"
            service: "odigos"
          annotations:
            summary: "Odigos central-backend pods are in CrashLoopBackOff (>= 1)"
            description: |
              {{ $value }} pod(s) of central-backend in
              namespace {{ $labels.namespace }} have been
              in CrashLoopBackOff for more than 5m.
            action: |
              kubectl -n odigos-central logs deploy/central-backend -c central-backend --previous --tail=200
            runbook_url: "https://docs.odigos.io/"
        - alert: CentralBackendDeploymentAbsent
          expr: |
            absent(
              kube_deployment_spec_replicas{
                namespace=~"odigos-central", deployment=~"central-backend"
              }
            )
          for: 15m
          labels:
            severity: critical
            alert_type: absent
            component: "central-backend"
            service: "odigos"
          annotations:
            summary: "Odigos central-backend Deployment metrics absent"
            description: |
              No `kube_deployment_spec_replicas` series for namespace
              `odigos-central` / deployment `central-backend` for more than 15m.
            runbook_url: "https://docs.odigos.io/"
        - alert: CentralUiNotAvailable
          expr: |
            kube_deployment_status_replicas_available{
              namespace=~"odigos-central", deployment=~"central-ui"
            } < 1
          for: 10m
          labels:
            severity: warning
            alert_type: availability
            component: "central-ui"
            service: "odigos"
          annotations:
            summary: "Odigos central-ui has fewer than 1 available replica(s)"
            description: |
              Deployment {{ $labels.namespace }}/{{ $labels.deployment }}
              has only {{ $value }} available replica(s),
              below the configured minimum of 1 for more than
              10m.
            action: |
              kubectl -n odigos-central get pods -l app.kubernetes.io/name=central-ui
              kubectl -n odigos-central describe deploy central-ui
            runbook_url: "https://docs.odigos.io/"
        - alert: CentralUiPodsCrashLooping
          expr: |
            count by (namespace) (
              kube_pod_container_status_waiting_reason{
                reason="CrashLoopBackOff",
                namespace=~"odigos-central",
                pod=~"central-ui-.*",
                container=~"central-ui"
              }
            ) >= 1
          for: 5m
          labels:
            severity: critical
            alert_type: crashloop
            component: "central-ui"
            service: "odigos"
          annotations:
            summary: "Odigos central-ui pods are in CrashLoopBackOff (>= 1)"
            description: |
              {{ $value }} pod(s) of central-ui in
              namespace {{ $labels.namespace }} have been
              in CrashLoopBackOff for more than 5m.
            action: |
              kubectl -n odigos-central logs deploy/central-ui -c central-ui --previous --tail=200
            runbook_url: "https://docs.odigos.io/"
        - alert: CentralUiDeploymentAbsent
          expr: |
            absent(
              kube_deployment_spec_replicas{
                namespace=~"odigos-central", deployment=~"central-ui"
              }
            )
          for: 15m
          labels:
            severity: critical
            alert_type: absent
            component: "central-ui"
            service: "odigos"
          annotations:
            summary: "Odigos central-ui Deployment metrics absent"
            description: |
              No `kube_deployment_spec_replicas` series for namespace
              `odigos-central` / deployment `central-ui` for more than 15m.
            runbook_url: "https://docs.odigos.io/"
